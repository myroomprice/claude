<!doctype html>
<!--
  The MyRoomPrice logo: one wordmark, "myroom" in ink (white on dark), "price" in ocean (sun on dark), with the
  map pin as the dot of the i, and the byline tucked under the right-hand end. The page's top bar uses the same
  markup (page/results.html, .logo). Each version is a page of its own:
  #horizontal-white-text and #stacked-white-text for dark backgrounds, #horizontal-dark-text and #stacked-dark-text
  for white ones, #horizontal-navy (1200x400), #stacked-navy (1080x1080) and #icon-navy (512x512).
  Render them all with: python3 tools/build_logos.py
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>MyRoomPrice logo</title>
<style>
  @font-face { font-family: 'Fraunces'; font-weight: 100 900; src: url('../page/fonts/fraunces-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'DM Sans'; font-weight: 100 1000; src: url('../page/fonts/dm-sans-latin-wght-normal.woff2') format('woff2'); }
  html, body { margin: 0; background: transparent; }
  .version { display: none; }
  .version:target { display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
  .navy { background: #0B3A4E; }
  .loose { padding: 0.5em; }
  /* Sizes are in em of the wordmark, so one font size scales the whole logo. */
  .logo { display: inline-flex; flex-direction: column; align-items: flex-end; line-height: 1; color: #fff; }
  .ink .logo { color: #0F2A3A; }
  .mark { font-family: 'Fraunces', serif; font-weight: 700; font-variation-settings: 'opsz' 32; letter-spacing: -0.035em; white-space: nowrap; }
  .p { color: #FFC53D; }
  .ink .p { color: #0A6E7D; }
  .i { position: relative; display: inline-block; }
  .i svg { position: absolute; left: 50%; bottom: 0.56em; width: 0.34em; height: 0.46em; transform: translateX(-50%); }
  .by { font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.3em; text-transform: uppercase; letter-spacing: 0.14em; margin: 0.45em 0.1em 0 0; opacity: 0.75; white-space: nowrap; }
  .stacked { align-items: center; }
  .stacked .by { margin-right: 0; }
  .icon svg { width: 2.4em; height: 3.2em; }
</style>
</head>
<body>
  <div id="horizontal-white-text" class="version loose" style="font-size:150px"><div class="logo"><span class="mark">myroom<span class="p">pr<span class="i">ı<svg viewBox="0 0 24 32" aria-hidden="true"><path fill="#ffc53d" fill-rule="evenodd" d="M12 0C5.4 0 0 5.3 0 11.9 0 20.6 12 32 12 32s12-11.4 12-20.1C24 5.3 18.6 0 12 0zm0 7.2a4.6 4.6 0 1 0 0 9.2 4.6 4.6 0 0 0 0-9.2z"/></svg></span>ce</span></span><span class="by">By Londoner in Sydney</span></div></div>
  <div id="stacked-white-text" class="version loose" style="font-size:150px"><div class="logo stacked"><span class="mark">myroom<span class="p">pr<span class="i">ı<svg viewBox="0 0 24 32" aria-hidden="true"><path fill="#ffc53d" fill-rule="evenodd" d="M12 0C5.4 0 0 5.3 0 11.9 0 20.6 12 32 12 32s12-11.4 12-20.1C24 5.3 18.6 0 12 0zm0 7.2a4.6 4.6 0 1 0 0 9.2 4.6 4.6 0 0 0 0-9.2z"/></svg></span>ce</span></span><span class="by">By Londoner in Sydney</span></div></div>
  <div id="horizontal-dark-text" class="version loose ink" style="font-size:150px"><div class="logo"><span class="mark">myroom<span class="p">pr<span class="i">ı<svg viewBox="0 0 24 32" aria-hidden="true"><path fill="#ffc53d" fill-rule="evenodd" d="M12 0C5.4 0 0 5.3 0 11.9 0 20.6 12 32 12 32s12-11.4 12-20.1C24 5.3 18.6 0 12 0zm0 7.2a4.6 4.6 0 1 0 0 9.2 4.6 4.6 0 0 0 0-9.2z"/></svg></span>ce</span></span><span class="by">By Londoner in Sydney</span></div></div>
  <div id="stacked-dark-text" class="version loose ink" style="font-size:150px"><div class="logo stacked"><span class="mark">myroom<span class="p">pr<span class="i">ı<svg viewBox="0 0 24 32" aria-hidden="true"><path fill="#ffc53d" fill-rule="evenodd" d="M12 0C5.4 0 0 5.3 0 11.9 0 20.6 12 32 12 32s12-11.4 12-20.1C24 5.3 18.6 0 12 0zm0 7.2a4.6 4.6 0 1 0 0 9.2 4.6 4.6 0 0 0 0-9.2z"/></svg></span>ce</span></span><span class="by">By Londoner in Sydney</span></div></div>
  <div id="horizontal-navy" class="version navy" style="width:1200px;height:400px;font-size:120px"><div class="logo"><span class="mark">myroom<span class="p">pr<span class="i">ı<svg viewBox="0 0 24 32" aria-hidden="true"><path fill="#ffc53d" fill-rule="evenodd" d="M12 0C5.4 0 0 5.3 0 11.9 0 20.6 12 32 12 32s12-11.4 12-20.1C24 5.3 18.6 0 12 0zm0 7.2a4.6 4.6 0 1 0 0 9.2 4.6 4.6 0 0 0 0-9.2z"/></svg></span>ce</span></span><span class="by">By Londoner in Sydney</span></div></div>
  <div id="stacked-navy" class="version navy" style="width:1080px;height:1080px;font-size:150px"><div class="logo stacked"><span class="mark">myroom<span class="p">pr<span class="i">ı<svg viewBox="0 0 24 32" aria-hidden="true"><path fill="#ffc53d" fill-rule="evenodd" d="M12 0C5.4 0 0 5.3 0 11.9 0 20.6 12 32 12 32s12-11.4 12-20.1C24 5.3 18.6 0 12 0zm0 7.2a4.6 4.6 0 1 0 0 9.2 4.6 4.6 0 0 0 0-9.2z"/></svg></span>ce</span></span><span class="by">By Londoner in Sydney</span></div></div>
  <div id="icon-navy" class="version navy icon" style="width:512px;height:512px;font-size:100px"><svg viewBox="0 0 24 32" aria-hidden="true"><path fill="#ffc53d" fill-rule="evenodd" d="M12 0C5.4 0 0 5.3 0 11.9 0 20.6 12 32 12 32s12-11.4 12-20.1C24 5.3 18.6 0 12 0zm0 7.2a4.6 4.6 0 1 0 0 9.2 4.6 4.6 0 0 0 0-9.2z"/></svg></div>
</body>
</html>
